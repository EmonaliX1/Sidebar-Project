<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Project 02 </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <aside class="sidebar">
    <header class="sidebar-header">
        <div class="header-logo">
           XEpen 
        </div>
        <button class="sidebar-toggle">
            <i class="fa-solid fa-angle-right"></i>
        </button>
    </header>

    <div class="sidebar-content">
        <form action="#" class="search-form">
            <label for="search">
                <i class="fa-solid fa-magnifying-glass"></i>
            </label>
            <input type="search" id="search" placeholder="Search....">
        </form>

        <ul class="nav-menu">
            <li class="nav-item">
                <a href="#" class="nav-link active">
                    <i class="fa-brands fa-windows"></i>
                <div class="nav-text">Dashboard</div>
                </a>
                  <li class="nav-item">
                <a href="#" class="nav-link">
                  <i class="fa-solid fa-store"></i>
                   <div class="nav-text">Product</div>
                </a>
                  <li class="nav-item">
                <a href="#" class="nav-link">
                    <i class="fa-solid fa-dollar-sign"></i>
                  <div class="nav-text">Price</div>
                </a>
                  <li class="nav-item">
                <a href="#" class="nav-link">
                   <i class="fa-solid fa-box-open"></i>
                   <div class="nav-text">BoxItem</div>
                </a>
                  <li class="nav-item">
                <a href="#" class="nav-link">
                    <i class="fa-brands fa-windows"></i>
                  <div class="nav-text">Container</div>
                </a>
                  <li class="nav-item">
                <a href="#" class="nav-link">
                   <i class="fa-solid fa-recycle"></i>
                   <div class="nav-text">Recycle</div>
                </a>
                  <li class="nav-item">
                <a href="#" class="nav-link">
                 <i class="fa-solid fa-gear"></i>
                    <div class="nav-text">Setting</div>
                </a>
            </li>
        </ul>

        <div class="sidebar-footer">
            <div class="dark-mode-toggle">
            </div>
        </div>
    </div>

   </aside>
   <script src="script.js"></script>
</body>
</html>
